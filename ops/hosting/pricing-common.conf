root /var/www/togoo-pricing/current/public;
index index.php;
charset utf-8;
client_max_body_size 20M;
add_header X-Frame-Options SAMEORIGIN always;
add_header X-Content-Type-Options nosniff always;
add_header X-ToGoo-Pricing-Origin "cp-isolated-20261105" always;
include /etc/togoo-pricing/acme.conf;
location / { try_files $uri $uri/ /index.php?$query_string; }
location = /index.php {
 include fastcgi_params;
 fastcgi_pass unix:/run/php/togoo-pricing.sock;
 fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
 fastcgi_param DOCUMENT_ROOT $realpath_root;
 fastcgi_param HTTPS $https if_not_empty;
 fastcgi_hide_header X-Powered-By;
}
location ~ \.php$ { return 404; }
location ~ /\.(?!well-known).* { deny all; }
location ~* \.(?:bak|sql|env|pem|key)$ { return 404; }
access_log /var/log/nginx/togoo-pricing-access.log;
error_log /var/log/nginx/togoo-pricing-error.log;
