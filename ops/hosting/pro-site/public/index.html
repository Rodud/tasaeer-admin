    <!-- Performance and SEO optimizations -->
    <script>
        // Preload critical resources
        const link = document.createElement('link');
        link.rel = 'prefetch';
        link.href = 'ToGooLogo500.png';
        document.head.appendChild(link);

        // Interactive features
        document.addEventListener('DOMContentLoaded', function() {
            const logo = document.querySelector('.logo');
            const shapes = document.querySelectorAll('.shape');
            const dots = document.querySelectorAll('.dot');
            const body = document.body;
            const logoContainer = document.querySelector('.logo-container');

            // تكبير الماوس عند المرور على الشعار
            logo.addEventListener('mouseenter', function() {
                body.classList.add('mouse-big');
            });
            logo.addEventListener('mouseleave', function() {
                body.classList.remove('mouse-big');
            });

            // Logo click interaction
            logo.addEventListener('click', function(e) {
                // نفس تأثير الضغط على أي مكان في الشاشة
                // createBubble(e.clientX, e.clientY, '#b684e6');
                // createWaveGlow(e);
            });

            // Mouse movement effect
            // تعريف دالة ripple للماوس ومتغير التوقيت خارج الحدث
            let lastRippleTime = 0;
            function createMouseRipple(x, y) {
                const now = Date.now();
                if (now - lastRippleTime < 40) return; // منع كثرة الإنشاء
                lastRippleTime = now;
                const ripple = document.createElement('div');
                ripple.style.position = 'fixed';
                ripple.style.left = x + 'px';
                ripple.style.top = y + 'px';
                ripple.style.width = '48px';
                ripple.style.height = '48px';
                ripple.style.background = 'radial-gradient(circle, rgba(186,134,230,0.18) 0%, rgba(117,20,197,0.09) 80%, transparent 100%)';
                ripple.style.borderRadius = '50%';
                ripple.style.transform = 'translate(-50%, -50%) scale(0.7)';
                ripple.style.opacity = '0.45';
                ripple.style.pointerEvents = 'none';
                ripple.style.zIndex = '30';
                ripple.style.animation = 'mouseRipplePop 0.9s cubic-bezier(.68,-0.55,.27,1.55) forwards';
                document.body.appendChild(ripple);
                setTimeout(() => { ripple.remove(); }, 900);
            }

            document.addEventListener('mousemove', function(e) {
                const mouseX = e.clientX / window.innerWidth;
                const mouseY = e.clientY / window.innerHeight;
                shapes.forEach((shape, index) => {
                    const speed = (index + 1) * 0.5;
                    const x = (mouseX - 0.5) * speed;
                    const y = (mouseY - 0.5) * speed;
                    shape.style.transform = `scale(1) rotate(0deg) translate(${x}px, ${y}px)`;
                });
                // Ripple لطيف عند تحريك الماوس
                createMouseRipple(e.clientX, e.clientY);
            });

            // Click anywhere to create bubble effect
            body.addEventListener('click', function(e) {
                // تأثير bubble القديم
                if (e.target === body || e.target.classList.contains('bg-shapes')) {
                    createBubble(e.clientX, e.clientY, '#b684e6');
                }
                // إضافة ripple في أي مكان في الشاشة
                createWaveGlow(e);
            });

            // Click on shapes to animate them
            shapes.forEach(shape => {
                shape.addEventListener('click', function(e) {
                    e.stopPropagation();
                    createBubble(e.clientX, e.clientY, '#b684e6');
                });
            });

            // Click on dots to animate them
            dots.forEach(dot => {
                dot.addEventListener('click', function(e) {
                    e.stopPropagation();
                    // نفس تأثير hover
                    dot.style.width = '8px';
                    dot.style.height = '8px';
                    dot.style.background = 'rgba(186, 134, 230, 0.5)';
                    dot.style.boxShadow = '0 0 12px 4px #b684e6';
                    dot.style.transform = 'scale(1.5)';
                    setTimeout(() => {
                        dot.style.width = '';
                        dot.style.height = '';
                        dot.style.background = '';
                        dot.style.boxShadow = '';
                        dot.style.transform = '';
                    }, 250);
                });
            });

            function createBubble(x, y, color) {
                const bubble = document.createElement('div');
                bubble.style.position = 'fixed';
                bubble.style.left = x + 'px';
                bubble.style.top = y + 'px';
                bubble.style.width = '18px';
                bubble.style.height = '18px';
                bubble.style.background = color;
                bubble.style.borderRadius = '50%';
                bubble.style.transform = 'translate(-50%, -50%) scale(0.7)';
                bubble.style.boxShadow = '0 0 16px 4px rgba(117,20,197,0.15)';
                bubble.style.opacity = '0.7';
                bubble.style.pointerEvents = 'none';
                bubble.style.zIndex = '15';
                bubble.style.animation = 'bubblePop 0.8s cubic-bezier(.68,-0.55,.27,1.55) forwards';
                body.appendChild(bubble);
                setTimeout(() => {
                    bubble.remove();
                }, 800);
            }

            // توهج دائري خلف الشعار من مكان ضغط الماوس
            function createWaveGlow(e) {
                const ripple = document.createElement('div');
                ripple.className = 'ripple-glow';
                // حساب موقع الضغط بالنسبة للعنصر الشعار
                const rect = logoContainer.getBoundingClientRect();
                const x = ((e.clientX - rect.left) / rect.width) * 100;
                const y = ((e.clientY - rect.top) / rect.height) * 100;
                ripple.style.setProperty('--ripple-x', x + '%');
                ripple.style.setProperty('--ripple-y', y + '%');
                logoContainer.insertBefore(ripple, logoContainer.firstChild);
                setTimeout(() => {
                    ripple.remove();
                }, 900);
        /* Ripple خلف الشعار عند الضغط */
            }

            // Add bubble and wave animation to CSS
            const style = document.createElement('style');
            style.textContent = `
                @keyframes bubblePop {
                    0% {
                        transform: translate(-50%, -50%) scale(0.7);
                        opacity: 0.7;
                    }
                    60% {
                        transform: translate(-50%, -50%) scale(2.5);
                        opacity: 0.5;
                    }
                    100% {
                        transform: translate(-50%, -50%) scale(0.1);
                        opacity: 0;
                    }
                }
                @keyframes mouseRipplePop {
                    0% {
                        transform: translate(-50%, -50%) scale(2);
                        opacity: 0.45;
                    }
                    80% {
                        transform: translate(-50%, -50%) scale(2.8);
                        opacity: 0.18;
                    }
                    100% {
                        transform: translate(-50%, -50%) scale(0.1);
                        opacity: 0;
                    }
                }
            `;
            document.head.appendChild(style);
        });

        // Simple analytics placeholder (replace with your analytics code if needed)
        // gtag('config', 'GA_MEASUREMENT_ID');
    </script>
