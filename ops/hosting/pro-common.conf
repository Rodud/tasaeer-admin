root /var/www/togoo-pro/current/public;
index index.html;
charset utf-8;
add_header X-Frame-Options SAMEORIGIN always;
add_header X-Content-Type-Options nosniff always;
add_header X-ToGoo-Pro-Origin "cp-static-20261105" always;
include /etc/togoo-pricing/acme.conf;
location / { try_files $uri $uri/ /index.html?$query_string; }
location ~ /\.(?!well-known).* { deny all; }
location ~* \.(?:php|bak|sql|env|pem|key)$ { return 404; }
access_log /var/log/nginx/togoo-pro-access.log;
error_log /var/log/nginx/togoo-pro-error.log;
