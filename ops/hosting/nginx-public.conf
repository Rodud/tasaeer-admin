server {
 listen 80;
 server_name pricing.rodud.com www.pricing.rodud.com;
 include /etc/togoo-pricing/acme.conf;
 location / { return 301 https://pricing.rodud.com$request_uri; }
}
server {
 listen 443 ssl;
 server_name pricing.rodud.com www.pricing.rodud.com;
 ssl_certificate /etc/letsencrypt/live/togoo-pricing/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/togoo-pricing/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 ssl_session_tickets off;
 include /etc/togoo-pricing/pricing-common.conf;
}
server {
 listen 80;
 server_name pro.togoo.sa;
 include /etc/togoo-pricing/acme.conf;
 location / { return 301 https://pro.togoo.sa$request_uri; }
}
server {
 listen 443 ssl;
 server_name pro.togoo.sa;
 ssl_certificate /etc/letsencrypt/live/togoo-pro/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/togoo-pro/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 ssl_session_tickets off;
 include /etc/togoo-pricing/pro-common.conf;
}
